<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>APC Cannock · 360° views</title>
<style>
:root{--ink:#060A16;--acc:#3AA0FF;--acc2:#7CF3D0;--soft:#8592AD}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 48px}
main{max-width:1100px;margin:0 auto}
.k{font:600 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-size:clamp(26px,4vw,40px);margin:10px 0 6px;letter-spacing:-.02em}
p{color:var(--soft);font-size:15px}
section{margin-top:36px;scroll-margin-top:20px}
h2{font-size:22px;margin:6px 0 12px}
h2 span{color:var(--acc)}
video{width:100%;border-radius:10px;border:1px solid rgba(58,160,255,.3);background:#000;display:block}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font:13px ui-monospace,Consolas,monospace;color:var(--soft)}
.meta b{color:#fff;font-weight:600}
footer{margin-top:44px;color:var(--soft);font:12px ui-monospace,Consolas,monospace;letter-spacing:.08em}
</style></head><body><main>
<div class="k">Orion MIS · APC Cannock phase 2</div>
<h1>360° views</h1>
<p>Rendered from Orion layout drawings. Indicative.</p>
<section id="mars"><div class="k">Package 1 · new line</div><h2>Mars <span>Line</span></h2>
<video src="mars-line-360.mp4" poster="mars-poster.jpg" controls loop playsinline preload="metadata"></video>
<div class="meta"><span>10 lanes</span><span>Handover <b>April 2027</b></span></div></section>
<section id="earth"><div class="k">Package 2 · new line</div><h2>Earth <span>Line</span></h2>
<video src="earth-line-360.mp4" poster="earth-poster.jpg" controls loop playsinline preload="metadata"></video>
<div class="meta"><span>5 take-away lanes</span><span>Handover <b>June 2027</b></span></div></section>
<footer>orionmis.co.uk</footer>
</main></body></html>
