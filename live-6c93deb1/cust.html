<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your project · Orion MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/track-180021fb/a/app.css">
<style>
.cpage{max-width:780px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:16px}
.hero{background:var(--steel);color:var(--on-steel);border-radius:6px;padding:20px 22px}
.hero .label{color:inherit;opacity:.8}
.hero h1{font-size:28px;font-weight:700}
.hero p{margin:4px 0 0;opacity:.85}
.trk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0}
.trk .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin:4px 0 0 4px;background:var(--panel)}
.trk.done .dot{background:var(--good);border-color:var(--good)}
.trk.cur .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.trk .nm{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted)}
.trk.done .nm,.trk.cur .nm{color:var(--ink)}
.trk .dt{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.youbox{border:2px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:14px 16px}
.youbox h2{font-size:19px;margin-bottom:8px}
.foot{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="cpage" id="main"><p class="empty">Loading…</p></main>
<script type="module" src="/track-180021fb/a/cust.js"></script>
</body>
</html>
